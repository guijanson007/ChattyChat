# Inside Docker network, postgres is reached by container name
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Production database safety: never auto-drop or update schema
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Disable Docker Compose auto-lifecycle on the VPS (Docker Compose handles it via command line)
spring.docker.compose.enabled=false