name: Continuous integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    # spin up a Postgres container specifically for this job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_chattychat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        env:
          # Map the runner's environment variables to the Postgres service above
          DB_URL: jdbc:postgresql://localhost:5432/ci_chattychat
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_password
          # Provide dummy values for OAuth so the context loads without crashing
          GOOGLE_CLIENT_ID: dummy_google_id
          GOOGLE_CLIENT_SECRET: dummy_google_secret
          GITHUB_CLIENT_ID: dummy_github_id
          GITHUB_CLIENT_SECRET: dummy_github_secret
        run: ./gradlew build
