# Connects to your local PostgreSQL container (or native instance)
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate update/create tables automatically during local tests
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

# Keep Docker Compose local lifecycle management enabled ONLY for local runs
spring.docker.compose.enabled=true

# Debug logs
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG