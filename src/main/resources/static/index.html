<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AriChat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ 1. username ============ -->
<section class="screen centered is-active" id="screen-name">
  <div class="card">
    <div class="brand"><span class="mark">A</span> AriChat</div>
    <h1>Qual é o seu nome?</h1>
    <p class="sub">Ele será exibido nas suas mensagens.</p>
    <form id="form-name" novalidate>
      <div class="field">
        <label for="input-name">Nome de exibição</label>
        <input class="input" id="input-name" placeholder="ex.: Matheus" autocomplete="nickname"
               maxlength="24" spellcheck="false" />
        <p class="hint" id="hint-name" role="alert"></p>
      </div>
      <button class="btn btn--block" type="submit" id="btn-name" disabled>Continuar</button>
    </form>
  </div>
</section>

<!-- ============ 2. rooms ============ -->
<section class="screen" id="screen-rooms">
  <div class="rooms-wrap" style="padding-top:200px; padding-bottom:200px; position:relative;">
    <div class="rooms-head">
      <div class="who">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="who-name" id="who-name">—</div>
          <div class="who-meta">conectado como você</div>
        </div>
      </div>
      <button class="btn btn--ghost" id="btn-change-name" type="button">Trocar nome</button>
    </div>

    <div class="panel">
      <div class="panel-title">Salas</div>
      <ul class="room-list" id="room-list"></ul>
      <p class="empty" id="rooms-empty" hidden>Nenhuma sala ainda. Crie a primeira abaixo.</p>
    </div>

    <form class="create" id="form-room" novalidate>
      <input class="input" id="input-room" placeholder="Nova sala (ex.: geral)" maxlength="32" spellcheck="false" />
      <button class="btn" type="submit">Criar e entrar</button>
    </form>
    <p class="hint" id="hint-room" role="alert"></p>
    <div style="font-size:16px; line-height:1; font-family:var(--font); position:absolute; left:229px; top:98px;">AriChat</div>
  </div>
</section>

<!-- ============ 3. chat ============ -->
<section class="screen" id="screen-chat">
  <div class="chat">
    <header class="chat-header">
      <button class="back" id="btn-back" type="button" aria-label="Voltar para as salas">&#8592;</button>
      <div>
        <div class="chat-title" id="chat-title"># sala</div>
        <div class="chat-meta" id="chat-meta">—</div>
      </div>
      <div class="status" id="status" data-state="offline" aria-live="polite">
        <span class="dot"></span><span id="status-text">offline</span>
      </div>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form class="composer" id="form-msg" novalidate>
      <input class="input" id="input-msg" placeholder="Escreva sua mensagem…" autocomplete="off" maxlength="1000" />
      <button class="btn send" type="submit" id="btn-send" aria-label="Enviar">&#8593;</button>
    </form>
  </div>
</section>

<!-- libs (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="app.js"></script>
</body>
</html>
