# Inside Docker network, postgres is reached by container name
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production database safety: never auto-drop or update schema
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Flyway owns the prod schema (migrations under db/migration); Hibernate only validates against it
spring.flyway.enabled=true

# Disable Docker Compose auto-lifecycle on the VPS (Docker Compose handles it via command line)
spring.docker.compose.enabled=false